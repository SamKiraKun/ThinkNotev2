version: 2.1

jobs:
  build_android:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    resource_class: large

    steps:
      - checkout

      - run:
          name: Verify Flutter project root
          command: |
            set -euo pipefail

            if [ ! -f pubspec.yaml ] || [ ! -d android ]; then
              echo "Expected Flutter project at the repository root."
              exit 1
            fi

      - restore_cache:
          keys:
            - flutter-pub-v1-{{ arch }}-{{ checksum "pubspec.lock" }}-{{ checksum "pubspec.yaml" }}
            - flutter-pub-v1-{{ arch }}-

      - restore_cache:
          keys:
            - gradle-cache-v1-{{ arch }}-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "android/build.gradle.kts" }}-{{ checksum "android/app/build.gradle.kts" }}-{{ checksum "android/settings.gradle.kts" }}-{{ checksum "android/gradle.properties" }}
            - gradle-cache-v1-{{ arch }}-

      - run:
          name: Flutter version
          command: flutter --version

      - run:
          name: Flutter doctor
          command: flutter doctor -v

      - run:
          name: Install dependencies
          command: flutter pub get

      - run:
          name: Analyze code
          command: flutter analyze

      - run:
          name: Run tests
          command: |
            set -euo pipefail

            mkdir -p build/test-results
            flutter test --reporter expanded | tee build/test-results/flutter-test-output.txt

      - run:
          name: Prepare Android signing
          command: |
            set -euo pipefail

            if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
              echo "Missing Android signing environment variables."
              echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
              exit 1
            fi

            umask 077
            mkdir -p android/app

            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              > android/key.properties

      - run:
          name: Build release Android artifacts
          command: |
            set -euo pipefail

            if [ -z "${APP_FLAVOR:-}" ]; then
              echo "Missing required runtime environment variable: APP_FLAVOR"
              exit 1
            fi

            case "${APP_FLAVOR}" in
              development|staging|production) ;;
              *)
                echo "APP_FLAVOR must be one of: development, staging, production"
                exit 1
                ;;
            esac

            : "${ENABLE_ANALYTICS:=false}"
            : "${ENABLE_EXPERIMENTAL_SYNC:=false}"

            if [ "${ENABLE_EXPERIMENTAL_SYNC}" = "true" ]; then
              required_sync_env=(
                API_URL
                FIREBASE_API_KEY
                FIREBASE_APP_ID
                FIREBASE_MESSAGING_SENDER_ID
                FIREBASE_PROJECT_ID
              )

              for var_name in "${required_sync_env[@]}"; do
                if [ -z "${!var_name:-}" ]; then
                  echo "Missing required experimental sync environment variable: ${var_name}"
                  exit 1
                fi
              done

              if [ "${APP_FLAVOR}" = "production" ] && [[ "${API_URL}" != https://* ]]; then
                echo "Production experimental sync builds must use an HTTPS API_URL."
                exit 1
              fi
            fi

            build_args=(
              "--release"
              "--build-number=${CIRCLE_BUILD_NUM:-1}"
              "--dart-define=APP_FLAVOR=${APP_FLAVOR}"
              "--dart-define=ENABLE_ANALYTICS=${ENABLE_ANALYTICS}"
              "--dart-define=ENABLE_EXPERIMENTAL_SYNC=${ENABLE_EXPERIMENTAL_SYNC}"
            )

            if [ -n "${API_URL:-}" ]; then
              build_args+=("--dart-define=API_URL=${API_URL}")
            fi

            if [ -n "${FIREBASE_API_KEY:-}" ]; then
              build_args+=("--dart-define=FIREBASE_API_KEY=${FIREBASE_API_KEY}")
            fi

            if [ -n "${FIREBASE_APP_ID:-}" ]; then
              build_args+=("--dart-define=FIREBASE_APP_ID=${FIREBASE_APP_ID}")
            fi

            if [ -n "${FIREBASE_MESSAGING_SENDER_ID:-}" ]; then
              build_args+=("--dart-define=FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID}")
            fi

            if [ -n "${FIREBASE_PROJECT_ID:-}" ]; then
              build_args+=("--dart-define=FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}")
            fi

            if [ -n "${FIREBASE_DATABASE_URL:-}" ]; then
              build_args+=("--dart-define=FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}")
            fi

            if [ -n "${FIREBASE_STORAGE_BUCKET:-}" ]; then
              build_args+=("--dart-define=FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}")
            fi

            if [ -n "${SENTRY_DSN:-}" ]; then
              build_args+=("--dart-define=SENTRY_DSN=${SENTRY_DSN}")
            fi

            if [ -n "${ANALYTICS_KEY:-}" ]; then
              build_args+=("--dart-define=ANALYTICS_KEY=${ANALYTICS_KEY}")
            fi

            flutter build apk "${build_args[@]}"
            flutter build appbundle "${build_args[@]}"

            mkdir -p build/release-metadata
            flutter --version > build/release-metadata/flutter-version.txt
            (cd android && ./gradlew --version) > build/release-metadata/gradle-version.txt

            cp pubspec.lock build/release-metadata/pubspec.lock
            cp android/gradle/wrapper/gradle-wrapper.properties build/release-metadata/gradle-wrapper.properties
            cp android/build.gradle.kts build/release-metadata/android-build.gradle.kts
            cp android/app/build.gradle.kts build/release-metadata/android-app-build.gradle.kts

            if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
              cp build/app/outputs/mapping/release/mapping.txt build/release-metadata/r8-mapping.txt
            else
              printf 'R8 mapping file was not generated for this build.\n' > build/release-metadata/r8-mapping.txt
            fi

            printf '{\n  "git_sha": "%s",\n  "circle_build_num": "%s",\n  "app_flavor": "%s",\n  "enable_analytics": "%s",\n  "enable_experimental_sync": "%s",\n  "play_artifact": "%s",\n  "qa_artifact": "%s",\n  "r8_mapping": "%s"\n}\n' \
              "${CIRCLE_SHA1:-$(git rev-parse HEAD)}" \
              "${CIRCLE_BUILD_NUM:-1}" \
              "${APP_FLAVOR}" \
              "${ENABLE_ANALYTICS}" \
              "${ENABLE_EXPERIMENTAL_SYNC}" \
              "build/app/outputs/bundle/release/app-release.aab" \
              "build/app/outputs/flutter-apk/app-release.apk" \
              "build/release-metadata/r8-mapping.txt" \
              > build/release-metadata/release-manifest.json

      - run:
          name: Verify signed release artifacts
          command: |
            set -euo pipefail

            test -f build/app/outputs/flutter-apk/app-release.apk
            test -f build/app/outputs/bundle/release/app-release.aab

            mkdir -p build/release-metadata
            jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab \
              > build/release-metadata/aab-signature-verification.txt
            unzip -tqq build/app/outputs/bundle/release/app-release.aab \
              > build/release-metadata/aab-zip-validation.txt

      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: qa-app-release.apk

      - store_artifacts:
          path: build/app/outputs/bundle/release/app-release.aab
          destination: play/app-release.aab

      - store_artifacts:
          path: build/release-metadata
          destination: release-metadata

      - store_artifacts:
          path: build/test-results
          destination: test-results

      - save_cache:
          key: flutter-pub-v1-{{ arch }}-{{ checksum "pubspec.lock" }}-{{ checksum "pubspec.yaml" }}
          paths:
            - ~/.pub-cache

      - save_cache:
          key: gradle-cache-v1-{{ arch }}-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "android/build.gradle.kts" }}-{{ checksum "android/app/build.gradle.kts" }}-{{ checksum "android/settings.gradle.kts" }}-{{ checksum "android/gradle.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

  backend_checks:
    docker:
      - image: cimg/node:22.11
    resource_class: medium

    steps:
      - checkout

      - restore_cache:
          keys:
            - backend-npm-v1-{{ arch }}-{{ checksum "backend/package-lock.json" }}
            - backend-npm-v1-{{ arch }}-

      - run:
          name: Install backend dependencies
          command: cd backend && npm ci

      - run:
          name: Build backend
          command: cd backend && npm run build

      - run:
          name: Test backend payload validation
          command: cd backend && npm test

      - run:
          name: Audit backend production dependencies
          command: cd backend && npm audit --omit=dev --audit-level=high

      - save_cache:
          key: backend-npm-v1-{{ arch }}-{{ checksum "backend/package-lock.json" }}
          paths:
            - backend/node_modules

workflows:
  android_build_workflow:
    jobs:
      - build_android
      - backend_checks
