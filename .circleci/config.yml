version: 2.1

jobs:
  build_android:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    resource_class: large

    steps:
      - checkout

      - run:
          name: Verify Flutter project root
          command: |
            set -euo pipefail

            if [ ! -f pubspec.yaml ] || [ ! -d android ]; then
              echo "Expected Flutter project at the repository root."
              exit 1
            fi

      - restore_cache:
          keys:
            - flutter-pub-v1-{{ arch }}-{{ checksum "pubspec.lock" }}-{{ checksum "pubspec.yaml" }}
            - flutter-pub-v1-{{ arch }}-

      - restore_cache:
          keys:
            - gradle-cache-v1-{{ arch }}-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "android/build.gradle.kts" }}-{{ checksum "android/app/build.gradle.kts" }}-{{ checksum "android/settings.gradle.kts" }}-{{ checksum "android/gradle.properties" }}
            - gradle-cache-v1-{{ arch }}-

      - run:
          name: Flutter version
          command: flutter --version

      - run:
          name: Flutter doctor
          command: flutter doctor -v

      - run:
          name: Install dependencies
          command: flutter pub get

      - run:
          name: Analyze code
          command: |
            set -euo pipefail

            mkdir -p build/test-results
            timeout 10m flutter analyze --no-pub --machine | tee build/test-results/flutter-analyze-machine.txt

      - run:
          name: Run tests
          command: |
            set -euo pipefail

            mkdir -p build/test-results
            timeout 10m flutter test --no-pub --reporter expanded | tee build/test-results/flutter-test-output.txt

      - run:
          name: Prepare Android signing
          command: |
            set -euo pipefail

            if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
              echo "Missing Android signing environment variables."
              echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD"
              exit 1
            fi

            umask 077
            mkdir -p android/app

            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              > android/key.properties

      - run:
          name: Build release Android artifacts
          command: bash scripts/android/build_release_artifacts.sh

      - run:
          name: Verify signed release artifacts
          command: bash scripts/android/verify_release_artifacts.sh

      - run:
          name: List generated Android artifacts
          command: |
            set -euo pipefail

            ls -lah build/release-artifacts
            find build/app/outputs -type f | sort

      - store_artifacts:
          path: build/release-artifacts/ThinkNote-qa-release.apk
          destination: ThinkNote-qa-release.apk

      - store_artifacts:
          path: build/release-artifacts/ThinkNote-release.aab
          destination: ThinkNote-release.aab

      - store_artifacts:
          path: build/release-metadata
          destination: release-metadata

      - store_artifacts:
          path: build/test-results
          destination: test-results

      - persist_to_workspace:
          root: .
          paths:
            - build/release-artifacts/ThinkNote-release.aab
            - build/release-metadata

      - save_cache:
          key: flutter-pub-v1-{{ arch }}-{{ checksum "pubspec.lock" }}-{{ checksum "pubspec.yaml" }}
          paths:
            - ~/.pub-cache

      - save_cache:
          key: gradle-cache-v1-{{ arch }}-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}-{{ checksum "android/build.gradle.kts" }}-{{ checksum "android/app/build.gradle.kts" }}-{{ checksum "android/settings.gradle.kts" }}-{{ checksum "android/gradle.properties" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper

      - run:
          name: Remove signing material
          when: always
          command: |
            rm -f android/key.properties
            rm -f android/app/upload-keystore.jks

  upload_play_internal:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    resource_class: small

    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Verify attached Play bundle
          command: |
            set -euo pipefail

            test -f build/release-artifacts/ThinkNote-release.aab
            test -s build/release-artifacts/ThinkNote-release.aab
            ls -lh build/release-artifacts/ThinkNote-release.aab
      - run:
          name: Upload to Play internal track
          command: |
            if [ -n "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
              gem install fastlane --no-document
              fastlane android internal
            else
              echo "PLAY_SERVICE_ACCOUNT_JSON is not configured. Skipping automated Google Play upload."
              exit 1
            fi

  backend_checks:
    docker:
      - image: cimg/node:22.11
    resource_class: medium

    steps:
      - checkout

      - restore_cache:
          keys:
            - backend-npm-v1-{{ arch }}-{{ checksum "backend/package-lock.json" }}
            - backend-npm-v1-{{ arch }}-

      - run:
          name: Install backend dependencies
          command: cd backend && npm ci

      - run:
          name: Build backend
          command: cd backend && npm run build

      - run:
          name: Test backend payload validation
          command: cd backend && npm test

      - run:
          name: Audit backend production dependencies
          command: cd backend && npm audit --omit=dev --audit-level=high

      - save_cache:
          key: backend-npm-v1-{{ arch }}-{{ checksum "backend/package-lock.json" }}
          paths:
            - backend/node_modules

  secret_scan:
    docker:
      - image: zricethezav/gitleaks:v8.18.2
    resource_class: small

    steps:
      - checkout

      - run:
          name: Scan repository for committed secrets
          command: gitleaks detect --source . --no-git --redact --no-banner

workflows:
  android_build_workflow:
    jobs:
      - build_android
      - backend_checks
      - secret_scan
      - request_play_promotion:
          type: approval
          requires:
            - build_android
            - backend_checks
            - secret_scan
      - upload_play_internal:
          requires:
            - request_play_promotion
