name: thinknote
description: "A premium, minimal, Gen Z-style notes app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.3
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/ThinkNote.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icons/ThinkNote.png
