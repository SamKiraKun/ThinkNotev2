name: thinknote
description: "A premium, minimal, Gen Z-style notes app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  connectivity_plus: ^6.1.5
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.3
  google_fonts: ^6.2.1
  http: ^1.5.0
  uuid: ^4.4.0
  intl: ^0.19.0
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.5
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.7
  sentry_flutter: 9.20.0
  sqlite3: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

dependency_overrides:
  objective_c: 9.4.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/ThinkNote.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icons/ThinkNote.png
