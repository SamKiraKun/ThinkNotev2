name: thinknote
description: "A premium, minimal, Gen Z-style notes app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.3
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.5.5
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.7
  sqlite3: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/ThinkNote.png
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icons/ThinkNote.png
